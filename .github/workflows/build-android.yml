name: Build MobileI2V Android APK v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MobileI2V source
        uses: actions/checkout@v4
        with:
          repository: himadriHK/MobileI2VConsole
          path: source

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Restore
        working-directory: source
        run: dotnet restore MobileI2VConsole.sln

      - name: Fix .NET 10 XAML compatibility
        working-directory: source
        shell: bash
        run: |
          sed -i 's/ IsLooping="[^"]*"//g' src/MobileI2VConsole/Views/ResultPage.xaml
          echo "ResultPage.xaml patched:"
          grep -n "MediaElement" src/MobileI2VConsole/Views/ResultPage.xaml || true

      - name: Inspect Android project
        working-directory: source
        shell: bash
        run: |
          echo "=== PROJECT CONFIG ==="
          grep -R "ApplicationId\|SupportedOSPlatformVersion\|TargetFramework" -n src/MobileI2VConsole/*.csproj || true
          echo "=== ANDROID MANIFEST ==="
          cat src/MobileI2VConsole/Platforms/Android/AndroidManifest.xml || true

      - name: Add startup diagnostics
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          p = Path("src/MobileI2VConsole/App.xaml.cs")
          s = p.read_text()

          print("=== App.xaml.cs ===")
          print(s[:12000])

          # Replace App.xaml.cs with a diagnostic-safe version.
          p.write_text('''namespace MobileI2VConsole;

public partial class App : Application
{
    public App()
    {
        try
        {
            InitializeComponent();
        }
        catch (Exception ex)
        {
            System.Diagnostics.Debug.WriteLine("STARTUP_CRASH_APPCOMPONENT: " + ex);
            throw;
        }
    }

    protected override Window CreateWindow(IActivationState? activationState)
    {
        try
        {
            return new Window(new AppShell());
        }
        catch (Exception ex)
        {
            System.Diagnostics.Debug.WriteLine("STARTUP_CRASH_APPSHELL: " + ex);
            throw;
        }
    }
}
''')
          print("APP STARTUP DIAGNOSTICS INSTALLED")
          PY2

      - name: Build APK
        working-directory: source
        run: |
          dotnet publish \
            src/MobileI2VConsole/MobileI2VConsole.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-Android-APK
          path: source/src/MobileI2VConsole/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
          retention-days: 7
